<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Golondrina - Pedidos por WhatsApp</title>
  <style>
    :root {
      --cream: #fff3dd;
      --cream-strong: #f8e2bd;
      --paper: #fffaf0;
      --navy: #07345b;
      --navy-2: #0b4878;
      --coral: #df5c46;
      --coral-dark: #b94131;
      --cheese: #f2b84b;
      --ink: #14222b;
      --muted: #766b5c;
      --line: #ead6b6;
      --white: #ffffff;
      --shadow: 0 18px 40px rgba(7, 52, 91, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(223, 92, 70, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(7, 52, 91, 0.06) 1px, transparent 1px),
        var(--cream);
      background-size: 34px 34px;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: center;
      margin-bottom: 22px;
      padding: 24px;
      color: var(--paper);
      background: var(--navy);
      border: 4px solid var(--paper);
      border-radius: 8px;
      box-shadow: var(--shadow);
      outline: 3px solid var(--coral);
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      left: -30px;
      right: -30px;
      height: 12px;
      background: var(--coral);
      opacity: 0.95;
    }

    .hero::before {
      top: 0;
    }

    .hero::after {
      bottom: 0;
      background: var(--cheese);
    }

    .brand {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--cheese);
      font-size: 0.84rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 28px;
      height: 3px;
      background: var(--coral);
      border-radius: 999px;
    }

    h1 {
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 6vw, 5.3rem);
      line-height: 0.9;
      letter-spacing: 0;
      text-transform: lowercase;
      text-shadow: 3px 3px 0 var(--coral-dark);
    }

    .lead {
      max-width: 680px;
      margin-top: 14px;
      color: #ffe9ca;
      font-size: 1.04rem;
      line-height: 1.5;
    }

    .brand-logo {
      position: relative;
      z-index: 1;
      width: min(310px, 28vw);
      min-width: 190px;
      border: 5px solid var(--paper);
      border-radius: 8px;
      background: var(--cream);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.18);
      display: block;
    }


    .theme-link {
      position: absolute;
      z-index: 3;
      top: 18px;
      right: 18px;
      width: 46px;
      height: 46px;
      display: inline-grid;
      place-items: center;
      color: var(--navy);
      background: var(--cheese);
      border: 3px solid var(--paper);
      border-radius: 50%;
      box-shadow: 0 5px 0 var(--coral-dark), 0 10px 20px rgba(0, 0, 0, 0.18);
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .theme-link:hover {
      transform: translateY(-1px) rotate(-6deg);
      background: var(--paper);
    }

    .theme-link svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2.5;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 22px;
      align-items: start;
    }

    .panel {
      overflow: hidden;
      background: var(--paper);
      border: 2px solid var(--navy);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      min-height: 66px;
      padding: 16px 18px;
      color: var(--paper);
      background: var(--navy);
      border-bottom: 5px solid var(--coral);
    }

    .section-title h2 {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .menu-note {
      color: #ffe6bf;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 18px;
    }

    .product {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 13px;
      min-height: 245px;
      padding: 14px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }

    .product-art {
      position: relative;
      overflow: hidden;
      min-height: 92px;
      border-radius: 7px;
      border: 2px solid var(--navy);
      background:
        linear-gradient(135deg, rgba(255, 250, 240, 0.88), rgba(255, 250, 240, 0.72)),
        repeating-linear-gradient(45deg, var(--cream-strong) 0 10px, #ffeccc 10px 20px);
    }

    .product-art::before {
      content: attr(data-label);
      position: absolute;
      left: 12px;
      bottom: 10px;
      color: var(--navy);
      font-size: clamp(1.45rem, 4vw, 2.4rem);
      font-weight: 900;
      line-height: 0.9;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 var(--paper);
    }

    .product-art::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 12px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--product-accent, var(--coral));
      box-shadow: inset 0 0 0 7px var(--cheese);
    }

    .product h3 {
      color: var(--navy);
      font-size: 1.1rem;
      line-height: 1.25;
    }

    .description {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.4;
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .price {
      color: var(--coral-dark);
      font-size: 1.16rem;
      font-weight: 900;
      white-space: nowrap;
    }

    button {
      border: 0;
      border-radius: 7px;
      min-height: 42px;
      padding: 0 14px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .btn-primary {
      min-width: 118px;
      color: var(--paper);
      background: var(--coral);
      box-shadow: 0 4px 0 var(--coral-dark);
    }

    .btn-primary:hover {
      background: var(--coral-dark);
    }

    .btn-whatsapp {
      width: 100%;
      color: var(--paper);
      background: var(--navy);
      border: 2px solid var(--navy);
      box-shadow: 0 5px 0 var(--coral);
    }

    .btn-whatsapp:hover {
      color: var(--navy);
      background: var(--cheese);
    }

    .btn-danger {
      min-height: 36px;
      color: var(--navy);
      background: var(--cheese);
      border: 2px solid var(--paper);
    }

    .cart-body {
      padding: 18px;
    }

    .empty {
      padding: 22px;
      border: 2px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
      background: var(--white);
    }

    .cart-list {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }

    .cart-name {
      color: var(--navy);
      font-weight: 900;
      line-height: 1.3;
    }

    .cart-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .quantity {
      display: inline-grid;
      grid-template-columns: 34px 38px 34px;
      align-items: center;
      justify-items: center;
      overflow: hidden;
      border: 2px solid var(--navy);
      border-radius: 7px;
      background: var(--paper);
    }

    .quantity button {
      width: 34px;
      min-height: 34px;
      padding: 0;
      border-radius: 0;
      color: var(--paper);
      background: var(--navy);
      font-size: 1rem;
    }

    .quantity span {
      color: var(--navy);
      font-weight: 900;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      padding: 14px 0;
      margin-top: 4px;
      border-top: 3px solid var(--navy);
      color: var(--navy);
      font-size: 1.16rem;
      font-weight: 900;
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 2px solid var(--line);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--navy);
      font-size: 0.92rem;
      font-weight: 900;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 2px solid var(--line);
      border-radius: 7px;
      padding: 0 12px;
      font: inherit;
      color: var(--ink);
      background: var(--white);
      outline: none;
    }

    input:focus {
      border-color: var(--coral);
      box-shadow: 0 0 0 3px rgba(223, 92, 70, 0.18);
    }

    .message {
      min-height: 22px;
      color: var(--coral-dark);
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.4;
    }

    @media (max-width: 920px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .brand-logo {
        width: min(260px, 78vw);
        min-width: 0;
      }

  
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      main {
        width: min(100% - 20px, 1180px);
        padding: 18px 0 28px;
      }

      .hero {
        padding: 20px 16px;
      }
      .theme-link {
        top: 12px;
        right: 12px;
        width: 42px;
        height: 42px;
      }

      .product-grid {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .section-title {
        align-items: flex-start;
        flex-direction: column;
      }

      .product-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .btn-primary {
        width: 100%;
      }

      .cart-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <a class="theme-link" href="index.html" title="Editar colores" aria-label="Editar colores de la pagina">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
      </a>
      <div class="brand">
        <p class="eyebrow">Pedidos al toque</p>
        <h1>La Golondrina</h1>
        <p class="lead">Smash burgers, papas fritas, completos y bebidas. Arma tu pedido y envíalo directo por WhatsApp.</p>
      </div>
      <img class="brand-logo" src="logo-la-golondrina.png" alt="Logo de La Golondrina">
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="products-title">
        <div class="section-title">
          <h2 id="products-title">Carta rápida</h2>
          <p class="menu-note">Colores inspirados en la marca</p>
        </div>
        <div class="product-grid" id="productList"></div>
      </section>

      <aside class="panel" aria-labelledby="cart-title">
        <div class="section-title">
          <h2 id="cart-title">Tu pedido</h2>
          <button type="button" class="btn-danger" id="clearCartBtn">Vaciar carrito</button>
        </div>

        <div class="cart-body">
          <div id="cartList"></div>

          <div class="total-row">
            <span>Total</span>
            <span id="cartTotal">$0</span>
          </div>

          <form id="orderForm">
            <label>
              Nombre
              <input type="text" id="customerName" autocomplete="name" placeholder="Ej: Camila Pérez">
            </label>

            <label>
              Dirección
              <input type="text" id="customerAddress" autocomplete="street-address" placeholder="Ej: Av. Siempre Viva 742">
            </label>

            <p class="message" id="formMessage" role="alert"></p>

            <button type="submit" class="btn-whatsapp">Enviar pedido por WhatsApp</button>
          </form>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const settingsKey = "laGolondrinaPublishedSettings";
    const draftKey = "laGolondrinaDraftSettings";
    const legacyThemeKey = "laGolondrinaTheme";

    const defaultSiteSettings = {
      business: {
        eyebrow: "Pedidos al toque",
        name: "La Golondrina",
        description: "Smash burgers, papas fritas, completos y bebidas. Arma tu pedido y envialo directo por WhatsApp.",
        logo: "logo-la-golondrina.png",
        logoAlt: "Logo de La Golondrina",
        whatsapp: "56959783307",
        email: "",
        address: "",
        hours: "",
        showLogo: true,
        showEmail: false,
        showAddress: false,
        showHours: false
      },
      header: {
        showEyebrow: true,
        showDescription: true,
        showLogo: true,
        logoSize: 310,
        align: "left"
      },
      menu: {
        title: "Carta rapida",
        note: "Colores inspirados en la marca",
        showNote: true,
        productAccentColor: "#df5c46"
      },
      order: {
        title: "Tu pedido",
        clearText: "Vaciar carrito",
        totalText: "Total",
        sendText: "Enviar pedido por WhatsApp",
        emptyCartText: "Todavia no hay productos agregados.",
        sentText: "Pedido listo para enviar por WhatsApp.",
        errorText: "Completa los datos obligatorios antes de enviar.",
        minOrder: 0,
        deliveryCost: 0,
        whatsapp: "56959783307",
        messageTemplate: "Hola La Golondrina, quiero hacer este pedido:",
        method: "whatsapp",
        acceptsOrders: true,
        hours: "",
        fields: {
          name: { label: "Nombre", placeholder: "Ej: Camila Perez", required: true, visible: true, type: "text" },
          phone: { label: "Telefono", placeholder: "Ej: +56 9 1234 5678", required: false, visible: false, type: "tel" },
          address: { label: "Direccion", placeholder: "Ej: Av. Siempre Viva 742", required: true, visible: true, type: "text" },
          deliveryType: { label: "Tipo de entrega", placeholder: "Selecciona una opcion", required: false, visible: false, type: "select", options: ["Retiro", "Despacho"] },
          notes: { label: "Observaciones", placeholder: "Sin cebolla, pago con sencillo, etc.", required: false, visible: false, type: "textarea" },
          payment: { label: "Metodo de pago", placeholder: "Selecciona una opcion", required: false, visible: false, type: "select", options: ["Efectivo", "Transferencia", "Tarjeta"] }
        }
      },
      theme: {
        "--cream": "#fff3dd",
        "--cream-strong": "#f8e2bd",
        "--paper": "#fffaf0",
        "--navy": "#07345b",
        "--navy-2": "#0b4878",
        "--coral": "#df5c46",
        "--coral-dark": "#b94131",
        "--cheese": "#f2b84b",
        "--ink": "#14222b",
        "--muted": "#766b5c",
        "--line": "#ead6b6",
        "--white": "#ffffff",
        titleFont: "Georgia, 'Times New Roman', serif",
        bodyFont: "Arial, Helvetica, sans-serif",
        baseFontSize: 16,
        cardRadius: 8,
        buttonRadius: 7,
        shadowIntensity: 16,
        maxWidth: 1180
      },
      products: [
        { id: "smash-clasica", shortName: "smash", name: "Smash burger clasica", description: "Doble carne smash, queso cheddar, pepinillos y salsa de la casa.", price: 6990, image: "", category: "Burgers", buttonText: "Agregar", available: true, featured: true, visible: true, order: 1 },
        { id: "papas-medianas", shortName: "papas", name: "Papas fritas medianas", description: "Papas crocantes con sal especiada y opcion ideal para compartir.", price: 3490, image: "", category: "Acompanamientos", buttonText: "Agregar", available: true, featured: false, visible: true, order: 2 },
        { id: "completo-italiano", shortName: "completo", name: "Completo italiano", description: "Pan suave, vienesa, tomate, palta y mayo estilo fuente de soda.", price: 2990, image: "", category: "Completos", buttonText: "Agregar", available: true, featured: false, visible: true, order: 3 },
        { id: "bebida-lata", shortName: "bebida", name: "Bebida lata 350 cc", description: "Bebida individual para acompanar tu pedido.", price: 1490, image: "", category: "Bebidas", buttonText: "Agregar", available: true, featured: false, visible: true, order: 4 }
      ]
    };

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function mergeDeep(base, extra) {
      const output = clone(base);
      if (!extra || typeof extra !== "object") return output;
      Object.keys(extra).forEach(key => {
        if (extra[key] && typeof extra[key] === "object" && !Array.isArray(extra[key]) && output[key] && typeof output[key] === "object" && !Array.isArray(output[key])) {
          output[key] = mergeDeep(output[key], extra[key]);
        } else {
          output[key] = extra[key];
        }
      });
      return output;
    }
    function readJson(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (error) { return null; } }
    function getSettingsFromUrl() {
      const themeParam = new URLSearchParams(window.location.search).get("theme");
      if (!themeParam) return null;
      try {
        const colors = JSON.parse(themeParam);
        const draft = mergeDeep(defaultSiteSettings, readJson(draftKey) || {});
        draft.theme = { ...draft.theme, ...colors };
        localStorage.setItem(draftKey, JSON.stringify(draft));
        window.history.replaceState(null, "", window.location.pathname);
        return draft;
      } catch (error) { return null; }
    }

    const legacyTheme = readJson(legacyThemeKey);
    const storedSettings = getSettingsFromUrl() || readJson(settingsKey) || readJson(draftKey);
    const siteSettings = mergeDeep(defaultSiteSettings, storedSettings || {});
    if (legacyTheme && !storedSettings) siteSettings.theme = { ...siteSettings.theme, ...legacyTheme };

    let cart = [];
    const productList = document.getElementById("productList");
    const cartList = document.getElementById("cartList");
    const cartTotal = document.getElementById("cartTotal");
    const clearCartBtn = document.getElementById("clearCartBtn");
    const orderForm = document.getElementById("orderForm");

    const moneyFormatter = new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 });
    function formatMoney(value) { return moneyFormatter.format(Number(value) || 0); }
    function css(value) { return String(value ?? "").replace(/[<>&"]/g, char => ({"<":"&lt;", ">":"&gt;", "&":"&amp;", "\"":"&quot;"}[char])); }

    function injectCompatibilityStyles() {
      const style = document.createElement("style");
      style.textContent = `
        select, textarea { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: var(--button-radius, 7px); padding: 0 12px; font: inherit; color: var(--ink); background: var(--white); outline: none; }
        textarea { min-height: 86px; padding-top: 10px; resize: vertical; }
        select:focus, textarea:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(223, 92, 70, 0.18); }
        .business-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; color: #ffe9ca; font-size: .92rem; font-weight: 700; }
        .product.is-unavailable { opacity: .62; }
        .product-badge { display:inline-flex; width:max-content; margin-bottom:8px; padding:4px 8px; color:var(--paper); background:var(--product-accent, var(--coral)); border-radius:999px; font-size:.72rem; font-weight:900; text-transform:uppercase; }
        .hero { color:var(--header-text, var(--paper)); background:var(--header-bg, var(--navy)); border-color:var(--header-logo-border, var(--paper)); outline-color:var(--header-top-border, var(--coral)); }
        .hero::before { background:var(--header-top-border, var(--coral)); }
        .hero::after { background:var(--header-bottom-border, var(--cheese)); }
        .eyebrow { color:var(--header-eyebrow, var(--cheese)); }
        h1 { color:var(--header-text, var(--paper)); text-shadow:3px 3px 0 var(--header-title-shadow, var(--coral-dark)); }
        .lead { color:var(--header-description, #ffe9ca); }
        .brand-logo { background:var(--header-logo-bg, var(--cream)); border-color:var(--header-logo-border, var(--paper)); }
      `;
      document.head.appendChild(style);
    }

    function applyTheme() {
      Object.entries(siteSettings.theme).forEach(([property, value]) => {
        if (property.startsWith("--") && /^#[0-9a-fA-F]{6}$/.test(value)) document.documentElement.style.setProperty(property, value);
      });
      document.documentElement.style.setProperty("--shadow", `0 18px 40px rgba(7, 52, 91, ${Math.max(0, Math.min(40, Number(siteSettings.theme.shadowIntensity) || 16)) / 100})`);
      document.documentElement.style.setProperty("--button-radius", `${Number(siteSettings.theme.buttonRadius) || 7}px`);
      document.documentElement.style.setProperty("--header-bg", siteSettings.header.backgroundColor || siteSettings.theme["--navy"]);
      document.documentElement.style.setProperty("--header-text", siteSettings.header.textColor || siteSettings.theme["--paper"]);
      document.documentElement.style.setProperty("--header-eyebrow", siteSettings.header.eyebrowColor || siteSettings.theme["--cheese"]);
      document.documentElement.style.setProperty("--header-description", siteSettings.header.descriptionColor || "#ffe9ca");
      document.documentElement.style.setProperty("--header-title-shadow", siteSettings.header.titleShadowColor || siteSettings.theme["--coral-dark"]);
      document.documentElement.style.setProperty("--header-top-border", siteSettings.header.topBorderColor || siteSettings.theme["--coral"]);
      document.documentElement.style.setProperty("--header-bottom-border", siteSettings.header.bottomBorderColor || siteSettings.theme["--cheese"]);
      document.documentElement.style.setProperty("--header-logo-bg", siteSettings.header.logoBackground || siteSettings.theme["--cream"]);
      document.documentElement.style.setProperty("--header-logo-border", siteSettings.header.logoBorderColor || siteSettings.theme["--paper"]);
      document.documentElement.style.setProperty("--product-accent", siteSettings.menu.productAccentColor || siteSettings.theme["--coral"]);
      document.body.style.fontFamily = siteSettings.theme.bodyFont;
      document.body.style.fontSize = `${Number(siteSettings.theme.baseFontSize) || 16}px`;
      document.querySelector("main").style.width = `min(${Number(siteSettings.theme.maxWidth) || 1180}px, calc(100% - 32px))`;
      document.querySelectorAll("h1").forEach(item => item.style.fontFamily = siteSettings.theme.titleFont);
      document.querySelectorAll(".panel,.product,.cart-item,.empty,.brand-logo").forEach(item => item.style.borderRadius = `${Number(siteSettings.theme.cardRadius) || 8}px`);
      document.querySelectorAll("button").forEach(item => item.style.borderRadius = `${Number(siteSettings.theme.buttonRadius) || 7}px`);
    }

    function renderBusiness() {
      document.title = `${siteSettings.business.name} - Pedidos por WhatsApp`;
      document.querySelector(".eyebrow").textContent = siteSettings.business.eyebrow;
      document.querySelector(".eyebrow").style.display = siteSettings.header.showEyebrow ? "inline-flex" : "none";
      document.querySelector("h1").textContent = siteSettings.business.name;
      document.querySelector(".lead").textContent = siteSettings.business.description;
      document.querySelector(".lead").style.display = siteSettings.header.showDescription ? "block" : "none";
      const logo = document.querySelector(".brand-logo");
      logo.src = siteSettings.business.logo || "logo-la-golondrina.png";
      logo.alt = siteSettings.business.logoAlt || siteSettings.business.name;
      logo.style.display = siteSettings.header.showLogo && siteSettings.business.showLogo ? "block" : "none";
      logo.style.width = `min(${Number(siteSettings.header.logoSize) || 310}px, 28vw)`;
      document.querySelector(".hero").style.textAlign = siteSettings.header.align;
      document.querySelector(".section-title h2").textContent = siteSettings.menu.title;
      const note = document.querySelector(".menu-note");
      note.textContent = siteSettings.menu.note;
      note.style.display = siteSettings.menu.showNote ? "block" : "none";
      const cartTitle = document.querySelector("#cart-title");
      cartTitle.textContent = siteSettings.order.title;
      clearCartBtn.textContent = siteSettings.order.clearText;
      const metaItems = [];
      if (siteSettings.business.showAddress && siteSettings.business.address) metaItems.push(siteSettings.business.address);
      if (siteSettings.business.showHours && siteSettings.business.hours) metaItems.push(siteSettings.business.hours);
      if (siteSettings.business.showEmail && siteSettings.business.email) metaItems.push(siteSettings.business.email);
      let meta = document.querySelector(".business-meta");
      if (!meta) { meta = document.createElement("div"); meta.className = "business-meta"; document.querySelector(".brand").appendChild(meta); }
      meta.innerHTML = metaItems.map(item => `<span>${css(item)}</span>`).join("");
    }

    function visibleProducts() {
      return siteSettings.products.filter(product => product.visible !== false).sort((a,b) => (Number(a.order)||0) - (Number(b.order)||0));
    }
    function renderProducts() {
      productList.innerHTML = visibleProducts().map(product => `
        <article class="product${product.available ? "" : " is-unavailable"}">
          <div class="product-art" data-label="${css(product.shortName)}" style="${product.image ? `background-image:url('${css(product.image)}');background-size:cover;background-position:center;` : ""}"></div>
          <div>
            ${product.featured ? `<span class="product-badge" style="background:${css(siteSettings.menu.productAccentColor || siteSettings.theme['--coral'])}">Destacado</span>` : ""}
            <h3>${css(product.name)}</h3>
            <p class="description">${css(product.description)}</p>
          </div>
          <div class="product-footer">
            <p class="price">${formatMoney(product.price)}</p>
            <button type="button" class="btn-primary" onclick="addToCart('${css(product.id)}')" ${product.available ? "" : "disabled"}>${product.available ? css(product.buttonText || "Agregar") : "Agotado"}</button>
          </div>
        </article>`).join("");
    }

    function renderOrderForm() {
      const fields = siteSettings.order.fields;
      const fieldHtml = Object.entries(fields).filter(([, field]) => field.visible).map(([key, field]) => {
        const required = field.required ? "required" : "";
        if (field.type === "textarea") return `<label>${css(field.label)}<textarea id="field-${key}" data-field="${key}" placeholder="${css(field.placeholder)}" ${required}></textarea></label>`;
        if (field.type === "select") return `<label>${css(field.label)}<select id="field-${key}" data-field="${key}" ${required}><option value="">${css(field.placeholder)}</option>${(field.options||[]).map(opt=>`<option>${css(opt)}</option>`).join("")}</select></label>`;
        return `<label>${css(field.label)}<input type="${field.type || "text"}" id="field-${key}" data-field="${key}" placeholder="${css(field.placeholder)}" autocomplete="${key === "name" ? "name" : key === "address" ? "street-address" : "off"}" ${required}></label>`;
      }).join("");
      orderForm.innerHTML = `${fieldHtml}<p class="message" id="formMessage" role="alert"></p><button type="submit" class="btn-whatsapp">${css(siteSettings.order.sendText)}</button>`;
      document.querySelector(".total-row span:first-child").textContent = siteSettings.order.totalText;
    }

    window.addToCart = function(productId) {
      const product = siteSettings.products.find(item => item.id === productId);
      if (!product || !product.available) return;
      const cartItem = cart.find(item => item.id === productId);
      if (cartItem) cartItem.quantity += 1; else cart.push({ ...product, quantity: 1 });
      const message = document.getElementById("formMessage");
      if (message) message.textContent = "";
      renderCart();
    };
    window.changeQuantity = function(productId, amount) {
      const cartItem = cart.find(item => item.id === productId);
      if (!cartItem) return;
      cartItem.quantity += amount;
      if (cartItem.quantity <= 0) cart = cart.filter(item => item.id !== productId);
      renderCart();
    };
    function getCartSubtotal() { return cart.reduce((total, item) => total + Number(item.price) * item.quantity, 0); }
    function getCartTotal() { return getCartSubtotal() + (cart.length ? Number(siteSettings.order.deliveryCost) || 0 : 0); }
    function renderCart() {
      clearCartBtn.disabled = cart.length === 0;
      cartList.innerHTML = cart.length === 0 ? `<div class="empty">${css(siteSettings.order.emptyCartText)}</div>` : `<div class="cart-list">${cart.map(item => `<div class="cart-item"><div><p class="cart-name">${css(item.name)}</p><p class="cart-meta">${formatMoney(item.price)} x ${item.quantity} = ${formatMoney(Number(item.price) * item.quantity)}</p></div><div class="quantity" aria-label="Cantidad de ${css(item.name)}"><button type="button" onclick="changeQuantity('${css(item.id)}', -1)" aria-label="Restar">-</button><span>${item.quantity}</span><button type="button" onclick="changeQuantity('${css(item.id)}', 1)" aria-label="Sumar">+</button></div></div>`).join("")}${siteSettings.order.deliveryCost > 0 ? `<div class="cart-item"><p class="cart-name">Despacho</p><p class="cart-meta">${formatMoney(siteSettings.order.deliveryCost)}</p></div>` : ""}</div>`;
      cartTotal.textContent = formatMoney(getCartTotal());
    }
    function readOrderData() {
      const data = {};
      Object.keys(siteSettings.order.fields).forEach(key => {
        const field = document.querySelector(`[data-field="${key}"]`);
        if (field) data[key] = field.value.trim();
      });
      return data;
    }
    function buildWhatsAppMessage(data) {
      const productLines = cart.map(item => `- ${item.name} x ${item.quantity}: ${formatMoney(Number(item.price) * item.quantity)}`).join("\n");
      const dataLines = Object.entries(siteSettings.order.fields).filter(([key, field]) => field.visible && data[key]).map(([key, field]) => `${field.label}: ${data[key]}`).join("\n");
      const deliveryLine = siteSettings.order.deliveryCost > 0 ? `\nDespacho: ${formatMoney(siteSettings.order.deliveryCost)}` : "";
      return `${siteSettings.order.messageTemplate}\n\n${productLines}${deliveryLine}\n\n${siteSettings.order.totalText}: ${formatMoney(getCartTotal())}\n\n${dataLines}`;
    }
    clearCartBtn.addEventListener("click", () => { if (!cart.length || confirm("Quieres vaciar el carrito?")) { cart = []; const message = document.getElementById("formMessage"); if (message) message.textContent = ""; renderCart(); } });
    orderForm.addEventListener("submit", event => {
      event.preventDefault();
      const messageNode = document.getElementById("formMessage");
      const subtotal = getCartSubtotal();
      if (!siteSettings.order.acceptsOrders) { messageNode.textContent = "En este momento no se aceptan pedidos."; return; }
      if (!cart.length) { messageNode.textContent = "Agrega al menos un producto al carrito."; return; }
      if (subtotal < Number(siteSettings.order.minOrder || 0)) { messageNode.textContent = `El pedido minimo es ${formatMoney(siteSettings.order.minOrder)}.`; return; }
      const data = readOrderData();
      const missing = Object.entries(siteSettings.order.fields).some(([key, field]) => field.visible && field.required && !data[key]);
      if (missing) { messageNode.textContent = siteSettings.order.errorText; return; }
      const encodedMessage = encodeURIComponent(buildWhatsAppMessage(data));
      const number = (siteSettings.order.whatsapp || siteSettings.business.whatsapp || "56959783307").replace(/\D/g, "");
      window.open(`https://wa.me/${number}?text=${encodedMessage}`, "_blank");
      messageNode.textContent = siteSettings.order.sentText;
    });

    injectCompatibilityStyles();
    applyTheme();
    renderBusiness();
    renderProducts();
    renderOrderForm();
    renderCart();
  </script>
</body>
</html>
